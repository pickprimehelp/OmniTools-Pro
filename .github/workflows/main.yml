name: Build Android APK & Play Store AAB

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK & Play Store AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Prepare Keystores and Environment
        run: |
          touch .env
          # Generate debug.keystore if missing
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi
          # Generate release upload key for Google Play AAB
          if [ ! -f my-upload-key.jks ]; then
            keytool -genkey -v -keystore my-upload-key.jks -storepass android123 -alias upload -keypass android123 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=OmniTools,O=OmniTools,C=IN"
          fi

      - name: Grant Execute Permission to gradlew
        run: chmod +x gradlew

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Play Store AAB Bundle
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: android123
          KEY_PASSWORD: android123
        run: ./gradlew bundleRelease --stacktrace --no-daemon

      - name: Build Debug APK for Testing
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload Play Store AAB Bundle
        uses: actions/upload-artifact@v4
        with:
          name: OmniTools-PlayStore-AAB
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 14

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: OmniTools-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
