name: Android CI - APK & AAB Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK and Play Store AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x ./gradlew

      - name: Build Test APK
        run: ./gradlew assembleDebug --no-daemon --max-workers=2
        env:
          GRADLE_OPTS: "-Xmx6g -XX:MaxMetaspaceSize=1g"

      - name: Upload Test APK
        uses: actions/upload-artifact@v4
        with:
          name: OmniTools-Test-APK-v1.3
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build Play Store Release AAB
        run: ./gradlew bundleRelease --no-daemon --max-workers=2
        env:
          GRADLE_OPTS: "-Xmx6g -XX:MaxMetaspaceSize=1g"

      - name: Verify Release AAB
        run: |
          echo "=== Play Store AAB ==="
          ls -lh app/build/outputs/bundle/release/app-release.aab

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: OmniTools-PlayStore-AAB-v1.3
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
