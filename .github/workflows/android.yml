
name: Android CI - APK & AAB Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK and AAB Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission
        run: chmod +x ./gradlew

      - name: Clean Old Build Files
        run: ./gradlew clean --no-daemon

      - name: Build Fresh APK and AAB
        run: ./gradlew assembleDebug bundleRelease --no-daemon

      - name: Verify APK and AAB
        run: |
          echo "=== APK FILE ==="
          ls -lh app/build/outputs/apk/debug/
          echo "=== AAB FILE ==="
          ls -lh app/build/outputs/bundle/release/

      - name: Upload New APK
        uses: actions/upload-artifact@v4
        with:
          name: omnitools-v2.3-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload New AAB
        uses: actions/upload-artifact@v4
        with:
          name: omnitools-v2.3-aab-playstore
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
