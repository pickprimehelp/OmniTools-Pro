name: Android CI - APK & AAB Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK and AAB Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x ./gradlew

      - name: Build APK and AAB with Gradle
        run: ./gradlew assembleDebug bundleDebug bundleRelease --no-daemon

      - name: Verify Generated Outputs
        run: |
          echo "=== Generated APKs ==="
          ls -la app/build/outputs/apk/debug/
          echo "=== Generated AAB Bundles ==="
          ls -la app/build/outputs/bundle/debug/ || true
          ls -la app/build/outputs/bundle/release/ || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: omnitools-v1.1-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload AAB Play Store Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: omnitools-v1.1-aab-playstore
          path: |
            app/build/outputs/bundle/debug/app-debug.aab
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
          retention-days: 30

